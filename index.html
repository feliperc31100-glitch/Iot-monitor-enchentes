<!-- Script de Integração com Firebase -->
    <script>
        function openTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));

            const buttons = document.querySelectorAll('.sidebar button');
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('btn-' + tabName).classList.add('active');
        }

        const urlFirebase = "https://monitor-de-enchentes-778b5-default-rtdb.firebaseio.com/";
        let emCarregamento = false; // Trava para evitar sobrecarga de requisições

        function atualizarDados() {
            if (emCarregamento) return; // Se já estiver buscando, pula o ciclo atual
            emCarregamento = true;

            fetch(urlFirebase + ".json")
                .then(response => response.json())
                .then(data => {
                    emCarregamento = false;
                    if (data) {
                        let led1 = false;
                        let led2 = false;
                        let led3 = false;

                        // 1. Atualiza os LEDs da aba Monitoramento (Painel Visual)
                        if (data.painel) {
                            led1 = Boolean(data.painel.led1);
                            led2 = Boolean(data.painel.led2);
                            led3 = Boolean(data.painel.led3);

                            setLedState('led-verde', 'item-verde', led1);
                            setLedState('led-amarelo', 'item-amarelo', led2);
                            setLedState('led-vermelho', 'item-vermelho', led3);
                        }

                        // 2. Validação baseada nos SENSORES FÍSICOS REAIS da água
                        let sVerde = false;
                        let sAmarelo = false;
                        let sVermelho = false;

                        if (data.sensores) {
                            sVerde = Boolean(data.sensores.verde);
                            sAmarelo = Boolean(data.sensores.amarelo);
                            sVermelho = Boolean(data.sensores.vermelho);
                        }

                        const bannerErro = document.getElementById('banner-erro');
                        let temErro = false;

                        // Regra: Amarelo físico ativado sem o Verde físico = Erro
                        if (sAmarelo && !sVerde) {
                            temErro = true;
                        }

                        // Regra: Vermelho físico ativado sem o Verde E o Amarelo físicos = Erro
                        if (sVermelho && (!sVerde || !sAmarelo)) {
                            temErro = true;
                        }

                        if (temErro) {
                            bannerErro.style.display = 'block';
                            bannerErro.innerText = "⚠️ ERRO DE LEITURA: Sequência inválida! O nível superior acionou sem os sensores inferiores correspondentes.";
                        } else {
                            bannerErro.style.display = 'none';
                        }

                        // 3. Atualiza os contadores da aba Histórico de Alertas
                        if (data.contadores) {
                            document.getElementById('contador-verde').innerText = Number(data.contadores.verde) || 0;
                            document.getElementById('contador-amarelo').innerText = Number(data.contadores.amarelo) || 0;
                            document.getElementById('contador-vermelho').innerText = Number(data.contadores.vermelho) || 0;
                        } else {
                            document.getElementById('contador-verde').innerText = 0;
                            document.getElementById('contador-amarelo').innerText = 0;
                            document.getElementById('contador-vermelho').innerText = 0;
                        }

                        // 4. Preenche a tabela do Histórico Geral (apenas se houver mudanças reais para poupar processamento)
                        const tbody = document.getElementById('tabela-historico-geral');
                        if (data.historico_geral) {
                            const chaves = Object.keys(data.historico_geral).sort((a, b) => b - a);
                            let htmlTabela = "";

                            chaves.forEach(key => {
                                const item = data.historico_geral[key];
                                htmlTabela += `
                                    <tr>
                                        <td>${item.data_hora || '---'}</td>
                                        <td><strong>${item.nivel || '---'}</strong></td>
                                    </tr>
                                `;
                            });
                            tbody.innerHTML = htmlTabela;
                        } else {
                            tbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: #6a7185;">Nenhum registro encontrado.</td></tr>`;
                        }
                    } else {
                        document.getElementById('contador-verde').innerText = 0;
                        document.getElementById('contador-amarelo').innerText = 0;
                        document.getElementById('contador-vermelho').innerText = 0;
                        document.getElementById('tabela-historico-geral').innerHTML = `<tr><td colspan="2" style="text-align: center; color: #6a7185;">Nenhum registro encontrado.</td></tr>`;
                        document.getElementById('banner-erro').style.display = 'none';
                    }
                })
                .catch(error => {
                    emCarregamento = false;
                    console.error("Erro na leitura do Firebase:", error);
                });
        }

        function setLedState(ledId, itemId, estado) {
            const led = document.getElementById(ledId);
            const item = document.getElementById(itemId);

            if (estado) {
                if (!led.classList.contains('ativo')) led.classList.add('ativo');
                if (!item.classList.contains('ativo')) item.classList.add('ativo');
            } else {
                if (led.classList.contains('ativo')) led.classList.remove('ativo');
                if (item.classList.contains('ativo')) item.classList.remove('ativo');
            }
        }

        function zerarContadores() {
            if (confirm("Tem certeza que deseja apagar todos os contadores e o histórico geral? Essa ação não pode ser desfeita.")) {
                const novosContadores = {
                    verde: 0,
                    amarelo: 0,
                    vermelho: 0
                };

                const p1 = fetch(urlFirebase + "contadores.json", {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novosContadores)
                });

                const p2 = fetch(urlFirebase + "historico_geral.json", {
                    method: 'DELETE'
                });

                Promise.all([p1, p2])
                    .then(() => {
                        document.getElementById('contador-verde').innerText = 0;
                        document.getElementById('contador-amarelo').innerText = 0;
                        document.getElementById('contador-vermelho').innerText = 0;
                        document.getElementById('tabela-historico-geral').innerHTML = `<tr><td colspan="2" style="text-align: center; color: #6a7185;">Nenhum registro encontrado.</td></tr>`;
                        alert("Histórico e contadores limpos com sucesso!");
                    })
                    .catch(error => console.error("Erro ao limpar dados:", error));
            }
        }

        // Atualização contínua em segundo plano
        atualizarDados();
        setInterval(atualizarDados, 3000); // Subido ligeiramente para 3 segundos para aliviar o navegador
    </script>
