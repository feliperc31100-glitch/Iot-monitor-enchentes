<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Monitor de Enchentes - TCC</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding-top: 50px; }
        .card { background: white; padding: 20px; margin: 10px auto; width: 300px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        .indicator { width: 30px; height: 30px; border-radius: 50%; display: inline-block; margin-left: 10px; vertical-align: middle; background-color: #ccc; }
        .active-green { background-color: #28a745; }
        .active-yellow { background-color: #ffc107; }
        .active-red { background-color: #dc3545; }
    </style>
</head>
<body>

    <h1>Painel de Monitoramento</h1>

    <div class="card">
        <h3>Nível 1 (Baixo) <span id="led1" class="indicator"></span></h3>
    </div>
    <div class="card">
        <h3>Nível 2 (Médio) <span id="led2" class="indicator"></span></h3>
    </div>
    <div class="card">
        <h3>Nível 3 (Alto/Crítico) <span id="led3" class="indicator"></span></h3>
    </div>

    <!-- Importação do Firebase via Compat SDK (Ideal para web estática) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Configuração do Firebase para o site
        const firebaseConfig = {
            databaseURL: "https://monitor-de-enchentes-778b5-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Elementos visuais HTML
        const elLed1 = document.getElementById('led1');
        const elLed2 = document.getElementById('led2');
        const elLed3 = document.getElementById('led3');

        // Escuta em tempo real as mudanças feitas pelo ESP32 no Firebase
        database.ref('painel').on('value', (snapshot) => {
            const dados = snapshot.val();
            if (!dados) return;

            // Atualiza LED 1
            if (dados.led1) {
                elLed1.className = "indicator active-green";
            } else {
                elLed1.className = "indicator";
            }

            // Atualiza LED 2
            if (dados.led2) {
                elLed2.className = "indicator active-yellow";
            } else {
                elLed2.className = "indicator";
            }

            // Atualiza LED 3
            if (dados.led3) {
                elLed3.className = "indicator active-red";
            } else {
                elLed3.className = "indicator";
            }
        });
    </script>
</body>
</html>
