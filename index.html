<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoramento Pluviométrico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #12141d;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Menu Lateral */
        .sidebar {
            width: 250px;
            background-color: #181b28;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid #222638;
        }

        .sidebar h1 {
            color: #0088ff;
            font-size: 20px;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .sidebar a {
            color: #a0a6b8;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 15px;
        }

        .sidebar a:hover {
            background-color: #222638;
            color: #ffffff;
        }

        .sidebar a.active {
            background-color: #0056ff;
            color: #ffffff;
            font-weight: bold;
        }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Card de Contadores */
        .card {
            background-color: #1b1f2e;
            padding: 30px;
            border-radius: 12px;
            width: 450px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 25px;
            text-align: center;
            color: #ffffff;
        }

        .nivel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #12141d;
            font-weight: bold;
            font-size: 15px;
        }

        /* Cores das Bordas Laterais dos Níveis */
        .nivel-verde {
            border-left: 5px solid #00C853;
        }

        .nivel-amarelo {
            border-left: 5px solid #FFD600;
        }

        .nivel-vermelho {
            border-left: 5px solid #D50000;
        }

        /* Estilo dos Números */
        .contador-num {
            font-size: 22px;
        }

        .nivel-verde .contador-num { color: #00C853; }
        .nivel-amarelo .contador-num { color: #FFD600; }
        .nivel-vermelho .contador-num { color: #D50000; }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <div class="sidebar">
        <h1>Sistema de<br>Monitoramento<br>Pluviométrico</h1>
        <a href="#">Sobre o Projeto</a>
        <a href="#">Monitoramento</a>
        <a href="#" class="active">Histórico de Alertas</a>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="card">
            <h2>Acionamentos dos Sensores</h2>

            <div class="nivel-item nivel-verde">
                <span>Nível Seguro (Verde)</span>
                <span id="contador-verde" class="contador-num">0</span>
            </div>

            <div class="nivel-item nivel-amarelo">
                <span>Nível Atenção (Amarelo)</span>
                <span id="contador-amarelo" class="contador-num">0</span>
            </div>

            <div class="nivel-item nivel-vermelho">
                <span>Nível Crítico (Vermelho)</span>
                <span id="contador-vermelho" class="contador-num">0</span>
            </div>
        </div>
    </div>

    <!-- Script de Integração com o Firebase Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Configuração do seu projeto Firebase (a mesma URL do ESP32)
        const firebaseConfig = {
            databaseURL: "https://monitor-de-enchentes-778b5-default-rtdb.firebaseio.com/"
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Ouve as alterações na pasta 'contadores' em tempo real
        const contadoresRef = ref(db, 'contadores/');
        onValue(contadoresRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // Atualiza os elementos HTML com os valores recebidos do ESP32
                document.getElementById('contador-verde').innerText = data.verde || 0;
                document.getElementById('contador-amarelo').innerText = data.amarelo || 0;
                document.getElementById('contador-vermelho').innerText = data.vermelho || 0;
            }
        });
    </script>

</body>
</html>
